name: cat_dogs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - jupyterlab
  - ipywidgets
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - tensorflow[and-cuda]==2.21.*
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - ultralytics-opencv-headless==8.4.154
      - numpy
      - pandas
      - matplotlib
      - opendatasets
      - opencv-python-headless
